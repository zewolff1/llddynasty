<div class="main-page-wrapper">
    <div class="side-panel left"></div>

    <div class="app-container">
        <header class="app-header">
            <div class="header-top-row">
                <div class="header-left-controls"></div>
                <div class="header-center-branding">
                    <img id="custom-header-logo" src="" alt="League Logo" class="league-logo">
                </div>
<div class="header-right-controls" style="display:flex; align-items:center; gap:8px;">
    <button id="open-calendar-btn" aria-label="League Calendar" style="background:none; border:none; cursor:pointer; padding:4px; display:flex; align-items:center;">

    </button>

</div>

                       <div id="live-draft-banner" style="display:none;"></div>

            <div class="league-tabs hide-scroll">
                <button class="tab-btn active" onclick="openMainTab(event, 'tab-team')">Team</button>

                <button class="tab-btn" onclick="openMainTab(event, 'tab-players')">Players</button>
                <button class="tab-btn" onclick="openMainTab(event, 'tab-league')">League</button>
                <button class="tab-btn" onclick="openMainTab(event, 'tab-draft')">Draft</button>
<button class="tab-btn" onclick="openMainTab(event, 'tab-scoreboard')">Scores</button>
<button class="tab-btn" onclick="openMainTab(event, 'tab-rules')">Rules</button>
            </div>

            <div class="sub-tabs-container hide-scroll">
                              <div id="subtabs-team" class="sub-tabs-group active">
                    <button class="sub-tab-btn active" onclick="openSubTab(event, 'lineup')">Lineup</button>
<button class="sub-tab-btn" onclick="openSubTab(event, 'contracts')">Manage</button>
<button class="sub-tab-btn" onclick="
    document.querySelector('.tab-btn[onclick*=\'tab-league\']').click();
    setTimeout(() => {
        $('#subtabs-league .sub-tab-btn').removeClass('active');
        $('#subtabs-league .sub-tab-btn').filter(function(){ return $(this).text().trim() === 'Trades'; }).addClass('active');
        window.loadTradeHub();
    }, 300);
">Trade</button>
</div>

                <div id="subtabs-players" class="sub-tabs-group">
                    <button class="sub-tab-btn active" onclick="openPlayersSubTab(event, 'free-agents')">Free Agents</button>
                    <button class="sub-tab-btn" onclick="openPlayersSubTab(event, 'all-players')">All Players</button>
                </div>

                <div id="subtabs-league" class="sub-tabs-group">
                    <button class="sub-tab-btn active" onclick="openLeagueSubTab(event, 'standings')">Standings</button>
                    <button class="sub-tab-btn" onclick="openLeagueSubTab(event, 'transactions')">Transactions</button>
                    <button class="sub-tab-btn" onclick="openLeagueSubTab(event, 'league-stats')">Stats</button>
<button class="sub-tab-btn" onclick="openLeagueSubTab(event, 'trades')">Trades</button>
                </div>
            </div>
        </header>

        <div class="content-scroll-wrapper">
            <div id="tab-team" class="tab-content active">
                <div id="player-rows-container"></div>
            </div>

            <div id="tab-players" class="tab-content">
                <div id="players-content-container"></div>
            </div>

            <div id="tab-league" class="tab-content">
                <div id="league-content-container"></div>
            </div>

  <div id="tab-draft" class="tab-content">
    <div id="draft-content-container"></div>
</div>

<div id="tab-scoreboard" class="tab-content">
    <div id="scores-content-container"></div>
</div>
<div id="tab-rules" class="tab-content">
    <div id="rules-content-container"></div>
</div>
<div id="tab-fa" class="tab-content">
    <div id="fa-content-container"></div>
</div>
        </div>
    </div>
    <div class="side-panel right"></div>

    <div id="player-context-menu" class="bottom-menu">
        <div class="menu-header"><div id="menu-player-info-container"></div></div>
        <div class="menu-body">
            <div class="action-container"><button id="menu-move-action" class="primary-menu-btn">Move Player</button></div>
            <div id="quick-swap-section">
                <div class="menu-divider"><span>Available Swaps</span></div>
                <div id="quick-swap-list" class="roster-grid"></div>
            </div>
        </div>
        <div class="menu-footer"><button class="cancel-btn" onclick="hideMenu()">Close Menu</button></div>
    </div>
</div>

<button id="lineup-submit-float" onclick="confirmAndSubmit()">
    <span>Submit Lineup Changes</span>
    <span class="change-count">0</span>
</button>
