 <button class="sub-tab-btn" onclick="openSubTab(event, 'contracts')">Contracts</button>
<button class="sub-tab-btn" onclick="
    document.querySelector('.tab-btn[onclick*=\'tab-league\']').click();
    setTimeout(() => {
        $('#subtabs-league .sub-tab-btn').removeClass('active');
        $('#subtabs-league .sub-tab-btn').filter(function(){ return $(this).text().trim() === 'Trades'; }).addClass('active');
        window.loadTradeHub();
    }, 300);
">Trade</button>
</div>

                <div id="subtabs-players" class="sub-tabs-group">
