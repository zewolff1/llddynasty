var SUF=/^(jr|sr|ii|iii|iv|v)$/;
function norm(s){return String(s||'').toLowerCase().replace(/[.,'\u2019`-]/g,' ').split(/\s+/).filter(function(w){return w&&!SUF.test(w)}).join('')}
function grp(p){p=String(p||'').toUpperCase();if(p==='K'||p==='PK')return 'K';if(p==='P'||p==='PN')return 'P';if(p==='DE'||p==='DT'||p==='DL')return 'DL';if(p==='CB'||p==='S'||p==='DB'||p==='FS'||p==='SS')return 'DB';if(p==='DEF')return 'DEF';return p}

var IDX={},DEFS={};
MFL.forEach(function(r){var nm=r[0];if(r[1]==='Def'){DEFS[r[2]]=nm;return}var parts=nm.split(', '),k=norm((parts[1]||'')+' '+parts[0]);(IDX[k]=IDX[k]||[]).push({name:nm,g:grp(r[1]),t:r[2]})});
function toMfl(sp){
 if(sp.position==='DEF'||sp.player_id&&/^[A-Z]{2,3}$/.test(sp.player_id)&&!sp.first_name){var t=TM[sp.player_id]||sp.player_id;return DEFS[t]?{name:DEFS[t]}:{miss:sp.player_id+' defense'}}
 var key=norm(sp.first_name+' '+sp.last_name),c=IDX[key]||[];
 if(!c.length)return {miss:(sp.first_name||'')+' '+(sp.last_name||'')+' ('+(sp.position||'?')+', '+(sp.team||'FA')+')'};
 if(c.length>1){var g=grp((sp.fantasy_positions&&sp.fantasy_positions[0])||sp.position),a=c.filter(function(x){return x.g===g});if(a.length)c=a}
 if(c.length>1){var t2=TM[sp.team]||sp.team,b=c.filter(function(x){return x.t===t2});if(b.length)c=b}
 return {name:c[0].name,dup:c.length>1}}
